spring.application.name=hetzner-ip-renewal

# Claude: токен проекта Hetzner Cloud с правом Read & Write (консоль → Security → API Tokens)
hetzner.token=${HETZNER_TOKEN}
# Claude: ID сервера — число в адресе страницы сервера в консоли Hetzner
hetzner.server-id=${HETZNER_SERVER_ID}

# Claude: токен с главной страницы duckdns.org после входа
duckdns.token=${DUCKDNS_TOKEN}
# Claude: поддомены через запятую без .duckdns.org — только те, что указывают прямо на Hetzner, не на каскад
duckdns.domains=${DUCKDNS_DOMAINS}

# Claude: российский VPS каскада; ключ бота там привязан к скрипту cascade/cascade-set-target
cascade.host=${CASCADE_HOST}
cascade.ssh-port=22
cascade.user=cascade-bot
# Claude: путь к закрытому ключу бота (OpenSSH, ed25519)
cascade.private-key=${CASCADE_PRIVATE_KEY}
# Claude: путь к known_hosts с ключами VPS — без него бот не подключится
cascade.known-hosts=${CASCADE_KNOWN_HOSTS}
# Claude: порт VPS, который пробрасывается на SSH сервера в Германии: по нему проверяется, что каскад работает
cascade.probe-port=2222

# Claude: ntfy на российском VPS — уведомления и команды (настройка в ntfy/README.md)
ntfy.url=${NTFY_URL}
# Claude: токен пользователя bot: пишет в топик уведомлений, читает топик команд
ntfy.token=${NTFY_TOKEN}
# Claude: токен пользователя phone: бот вставляет его в кнопки уведомлений, чтобы они могли отправить команду
ntfy.command-token=${NTFY_COMMAND_TOKEN}
ntfy.alerts-topic=vpn-alerts
ntfy.commands-topic=vpn-commands
ntfy.poll-interval=15s

renewal.check-interval=10m
# Claude: через сколько недоступности прислать предупреждение
renewal.alert-threshold=30m
# Claude: сколько IP должен быть недоступен подряд, чтобы считать его заблокированным и сменить
renewal.outage-threshold=1h
# Claude: TCP-порт сервера, по которому проверяется доступность (SSH)
renewal.probe-port=22
renewal.probe-timeout=5s
# Claude: сколько ждать штатного выключения, прежде чем выключить сервер принудительно
renewal.shutdown-timeout=3m
